services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: strategist
      POSTGRES_USER: strategist
      POSTGRES_PASSWORD: strategist
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    environment:
      PORT: 8787
      JWT_SECRET: change-me-in-production
      DATABASE_URL: postgres://strategist:strategist@postgres:5432/strategist
    ports:
      - "8787:8787"
    depends_on:
      - postgres

volumes:
  pgdata:
